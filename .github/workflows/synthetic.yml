name: Synthetic monitor

# Checks backline.travel the way a person uses it, and can plan a real trip end to end.
# Runs only when started by hand (Actions > Synthetic monitor > Run workflow). To run it on a timer
# again, add back a schedule, e.g.:  schedule: [{ cron: "0 */6 * * *" }]
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Also plan a trip end to end"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live site
        run: node scripts/synthetic.mjs --base "${{ vars.SITE_URL || 'https://backline.travel' }}" ${{ inputs.plan && '--plan' || '' }}
