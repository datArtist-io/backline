name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/check-secrets.mjs $(git ls-files)
      - run: npm test
      - run: npm run evals -w @backline/engine

  design:
    name: Flows, layout and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      # Runners have no GPU: the WebGL interactions (the globe) time out there, so they run on a
      # developer machine (`npm run e2e` in apps/web). Everything else runs here.
      - run: npm run e2e
        working-directory: apps/web
        env:
          CI: "1"
          E2E_LITE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
